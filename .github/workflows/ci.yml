# Tests-only by doctrine: releases here are TAG-driven (`release.yml`), so
# there is no environment dimension to flip and this file is identical on both
# branches. Pushing `development` publishes nothing.
#
# It exists because until 1.0.0 the tag workflow was the only automated gate on
# this repo — a broken commit on `development` was discovered at release time,
# which is the worst moment to discover one. The pre-commit hook is a fast gate
# (credential scan, lint, typecheck); suites live in CI, never in hooks.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # No `version:` — pnpm/action-setup reads the `packageManager` field,
      # so the pnpm pin lives in exactly one place.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec biome ci .

      - run: pnpm typecheck

      # BEFORE the suite, not after: `tests/mcp-entry.test.ts` executes
      # `dist/mcp-server.js` and refuses to run against a stale or missing
      # build, so an unbuilt tree fails the suite rather than skipping the one
      # fence that proves the bundled server starts at all.
      - run: pnpm build

      - run: pnpm coverage

      # The editor is ~140MB and versioned by ONE fact: the engines floor. The
      # cache key derives from that fact — not from a hash of the whole
      # manifest, which would re-download the same editor on every dependency
      # bump — so the cache invalidates exactly when a different editor must
      # be downloaded, and only then.
      - id: floor
        run: echo "version=$(node -p "require('./package.json').engines.vscode.replace(/^\D*/, '')")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ steps.floor.outputs.version }}

      # The HOST tier: a real VS Code at the engines floor, running the built
      # extension. It is the only step that can observe the contract with the
      # editor — `engines.vscode` claimed `^1.99.0` against an API that does not
      # exist below 1.101, and no mock could ever have seen it. Linux needs a
      # display; `xvfb-run` provides one.
      - run: xvfb-run -a pnpm test:host

  # A red run on a push or a schedule reaches the operator's alerts channel for
  # its environment (production on main, development elsewhere); a pull
  # request's red already has a reader, its author. The webhook is a secret of
  # that environment, so only this job can read it. It runs nothing but curl,
  # and an unset secret fails it rather than skipping it. Root CLAUDE.md, "CI
  # notifications".
  notify:
    needs: [test]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      deployment: false
    steps:
      - name: Post to the alerts channel
        env:
          ALERTS_WEBHOOK: ${{ secrets.ALERTS_WEBHOOK }}
        run: |
          MESSAGE="🔴 vscode CI failed on $GITHUB_REF_NAME"
          [ -n "$ALERTS_WEBHOOK" ] || { echo "::error::ALERTS_WEBHOOK is not set in the environment this run selected, so this outcome reached nobody"; exit 1; }
          curl --fail-with-body -sS --form-string "content=$MESSAGE <$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID>" "$ALERTS_WEBHOOK"
