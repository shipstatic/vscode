# The platform's publish law, TRANSLATED — not copied.
#
# The npm law (root CLAUDE.md, "The npm publish law") says: the version picks
# the channel, the branch grants the right to use it, publishes are idempotent,
# and a skip says so out loud. Every one of those intents applies here; not one
# of the mechanisms does. This registry has no dist-tags, no semver
# prereleases, no trusted publishing, and its trigger is a TAG rather than a
# branch. So each intent gets its own local expression:
#
#   the version picks the channel  → the MINOR's parity. The Marketplace
#                                    forbids semver prereleases (plain
#                                    major.minor.patch only) and uses odd/even
#                                    minor as its pre-release convention.
#                                    Derived, never hand-picked.
#   the branch grants the right    → the TAG grants it, so the tag and the
#                                    manifest must agree. Asserted first.
#   trusted publishing (no secret) → no equivalent exists. Nearest posture: one
#                                    PAT per storefront, each in its own
#                                    environment (`marketplace`, `open-vsx`)
#                                    whose deployment policy admits only `v*`
#                                    tags, so no other ref can reach it.
#                                    READ THIS BEFORE TRUSTING IT: the two
#                                    environments exist and the jobs below
#                                    declare them, but the PAT VALUES still sit
#                                    at REPO level, where any workflow can read
#                                    them without declaring an environment. The
#                                    tag policy therefore gates the JOB and not
#                                    yet the SECRET. Only the operator holds the
#                                    values, so only the operator can close it;
#                                    root `backlog.md` carries the two commands.
#                                    Until then this line describes the shape,
#                                    not the state.
#   one job, one credential        → the npm law's tail, applied here. `build`
#                                    holds the OIDC grant and nothing else;
#                                    `release` holds `contents: write` alone;
#                                    each storefront publishes from its own job
#                                    with its own PAT. No third-party action
#                                    runs beside any of them. Before 2026-09-23
#                                    all of it lived in ONE job: the OIDC grant,
#                                    `contents: write`, both PATs, and a
#                                    third-party release action beside them. It
#                                    also meant a 503 from one storefront left a
#                                    half-published release under a single red
#                                    job, which is how 1.0.3 reached the
#                                    Marketplace and never reached Open VSX.
#   idempotent publishes           → query each registry for the version first.
#   a skip says so                 → `::notice`, never silence.
#   provenance attestations        → `actions/attest-build-provenance` over the
#                                    `.vsix`, verifiable with
#                                    `gh attestation verify`. The npm law gets
#                                    this from `npm publish --provenance`; the
#                                    mechanism differs, the guarantee does not.
#                                    The `.vsix` on the Release is what the
#                                    attestation is ABOUT.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The same gate `ci.yml` runs on every branch, re-run against the tagged tree.
  # A tag can point anywhere, so "development was green" is not a statement
  # about this ref.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm coverage

  # The publish decision is its own job because `publish`'s `environment:` is
  # evaluated before any step runs — it can only read another job's outputs.
  # Same reason the npm law splits `version` out.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.decide.outputs.version }}
      channel: ${{ steps.decide.outputs.channel }}
      flag: ${{ steps.decide.outputs.flag }}
      extension: ${{ steps.decide.outputs.extension }}
      vsix: ${{ steps.decide.outputs.vsix }}
      marketplace: ${{ steps.decide.outputs.marketplace }}
      openvsx: ${{ steps.decide.outputs.openvsx }}
    steps:
      - uses: actions/checkout@v7

      - id: decide
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version package.json)
          PUBLISHER=$(jq -r .publisher package.json)
          NAME=$(jq -r .name package.json)
          # Two identifiers, and they are not interchangeable: the registries
          # address an extension as `publisher.name`, while `vsce package`
          # writes `name-version.vsix`.
          EXTENSION="$PUBLISHER.$NAME"

          # --- The tag grants the right, so the tag and the manifest must agree.
          # One fact, previously stated twice with nothing comparing them:
          # tagging v1.0.0 on a 0.2.10 tree published 0.2.10 under a v1.0.0
          # GitHub Release. Fails before anything is packaged.
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error title=Tag and manifest disagree::$GITHUB_REF_NAME was pushed, but package.json holds $VERSION. Tag v$VERSION, or bump the manifest to match the tag."
            exit 1
          fi

          # --- The Marketplace accepts plain major.minor.patch only.
          # A `-beta.1` version would be refused at the registry, deep into the
          # run and with a message about neither the law nor the fix.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Unpublishable version::$VERSION is not plain major.minor.patch. The Marketplace forbids semver prereleases; the pre-release channel is the ODD MINOR (see the header of this file)."
            exit 1
          fi

          # --- The VERSION picks the channel: odd minor → pre-release.
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          if [ $((MINOR % 2)) -eq 1 ]; then
            CHANNEL=pre-release
            FLAG=--pre-release
          else
            CHANNEL=stable
            FLAG=
          fi

          echo "::notice title=Releasing::$EXTENSION $VERSION on the $CHANNEL channel (minor $MINOR)."

          # --- Idempotence: a version already on a registry is a no-op there.
          # An UNKNOWN answer means publish, never skip — a failed query must
          # not silently cancel a release. Both probes therefore default to
          # "not published" on any error.
          MARKETPLACE=false
          if curl -sf -X POST 'https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery' \
               -H 'Content-Type: application/json' \
               -H 'Accept: application/json;api-version=3.0-preview.1' \
               -d "{\"filters\":[{\"criteria\":[{\"filterType\":7,\"value\":\"$EXTENSION\"}]}],\"flags\":1}" \
             | jq -e --arg v "$VERSION" \
               '[.results[0].extensions[0].versions[]?.version] | index($v)' >/dev/null 2>&1; then
            MARKETPLACE=true
          fi

          OPENVSX=false
          if curl -sf -o /dev/null "https://open-vsx.org/api/$PUBLISHER/$NAME/$VERSION"; then
            OPENVSX=true
          fi

          {
            echo "version=$VERSION"
            echo "channel=$CHANNEL"
            echo "flag=$FLAG"
            echo "extension=$EXTENSION"
            echo "vsix=dist/$NAME-$VERSION.vsix"
            echo "marketplace=$MARKETPLACE"
            echo "openvsx=$OPENVSX"
          } >> "$GITHUB_OUTPUT"

  # ─── The tail, on the npm law's own split: one job, one credential ───────
  #
  # `build` mints the attestation, so it holds `id-token: write` — a job-scoped
  # grant any step in the job could use. That is why it runs FIRST-PARTY steps
  # only and holds nothing else: no `contents: write`, no PAT, no environment.
  # The `.vsix` it attests is handed on as a workflow artifact, so every job
  # below publishes the exact bytes the attestation is about.
  build:
    needs: [test, version]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # The channel is baked into the package, so the artifact attached to the
      # Release and the artifact published are the same bytes on the same
      # channel — the flag is not re-decided at publish time.
      - run: pnpm exec vsce package ${{ needs.version.outputs.flag }} --out dist/

      # Signed provenance for the exact bytes every job below will ship.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ needs.version.outputs.vsix }}

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ${{ needs.version.outputs.vsix }}
          if-no-files-found: error
          retention-days: 7

  # `contents: write` alone, and `gh` talks to the API — the same posture the
  # npm law's release job takes. It was `softprops/action-gh-release`, which is
  # third-party code that used to run beside the OIDC grant.
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          PRERELEASE=""
          [ "${{ needs.version.outputs.channel }}" = "pre-release" ] && PRERELEASE="--prerelease"
          # Idempotent like every other step here: a re-run after a storefront
          # failure must not fail on the Release that already exists.
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice title=Release exists::v$VERSION is already a GitHub Release. Re-uploading the .vsix."
            gh release upload "v$VERSION" "${{ needs.version.outputs.vsix }}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "v$VERSION" "${{ needs.version.outputs.vsix }}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "v$VERSION" \
              --generate-notes \
              $PRERELEASE
          fi

  # One storefront, one job, one PAT. They were two steps in one job, which is
  # why a 503 from Open VSX on the v1.0.3 release presented as a single red job
  # that did not say the Marketplace half had already succeeded. Split, a
  # failure names its own storefront and "Re-run failed jobs" repairs exactly
  # that half — the publish law's own repair, now applicable here.
  marketplace:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions: {}
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Already published
        if: needs.version.outputs.marketplace == 'true'
        run: echo "::notice title=Marketplace skipped::${{ needs.version.outputs.extension }} ${{ needs.version.outputs.version }} is already on the Visual Studio Marketplace. Re-running a published tag is a no-op."

      - name: No credential
        if: needs.version.outputs.marketplace != 'true' && env.VSCE_PAT == ''
        run: echo "::notice title=Marketplace skipped::VSCE_PAT is not readable from the 'marketplace' environment, so nothing was published to the Visual Studio Marketplace."

      # The publishing tool comes from the LOCKFILE, so the version that ships
      # an artifact is the one the repo resolved and a bot can bump. Hardcoding
      # it in the workflow would be a second statement of the same fact with
      # nothing comparing them. The checkout that makes that possible carries
      # `persist-credentials: false`, so the only credential in this job is the
      # one storefront PAT.
      - uses: actions/checkout@v7
        if: needs.version.outputs.marketplace != 'true' && env.VSCE_PAT != ''
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        if: needs.version.outputs.marketplace != 'true' && env.VSCE_PAT != ''
      - uses: actions/setup-node@v7
        if: needs.version.outputs.marketplace != 'true' && env.VSCE_PAT != ''
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.version.outputs.marketplace != 'true' && env.VSCE_PAT != ''

      - uses: actions/download-artifact@v8
        if: needs.version.outputs.marketplace != 'true' && env.VSCE_PAT != ''
        with:
          name: vsix
          path: dist/

      - name: Publish to VS Code Marketplace
        if: needs.version.outputs.marketplace != 'true' && env.VSCE_PAT != ''
        # The channel flag precedes `--packagePath`, which is VARIADIC — a trailing
        # flag would be read as another package path on some parser versions.
        run: pnpm exec vsce publish ${{ needs.version.outputs.flag }} --packagePath "${{ needs.version.outputs.vsix }}"

  openvsx:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: open-vsx
    permissions: {}
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Already published
        if: needs.version.outputs.openvsx == 'true'
        run: echo "::notice title=Open VSX skipped::${{ needs.version.outputs.extension }} ${{ needs.version.outputs.version }} is already on Open VSX. Re-running a published tag is a no-op."

      - name: No credential
        if: needs.version.outputs.openvsx != 'true' && env.OVSX_PAT == ''
        run: echo "::notice title=Open VSX skipped::OVSX_PAT is not readable from the 'open-vsx' environment, so nothing was published to Open VSX."

      - uses: actions/checkout@v7
        if: needs.version.outputs.openvsx != 'true' && env.OVSX_PAT != ''
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        if: needs.version.outputs.openvsx != 'true' && env.OVSX_PAT != ''
      - uses: actions/setup-node@v7
        if: needs.version.outputs.openvsx != 'true' && env.OVSX_PAT != ''
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.version.outputs.openvsx != 'true' && env.OVSX_PAT != ''

      - uses: actions/download-artifact@v8
        if: needs.version.outputs.openvsx != 'true' && env.OVSX_PAT != ''
        with:
          name: vsix
          path: dist/

      - name: Publish to Open VSX
        if: needs.version.outputs.openvsx != 'true' && env.OVSX_PAT != ''
        run: pnpm exec ovsx publish "${{ needs.version.outputs.vsix }}" ${{ needs.version.outputs.flag }} -p "$OVSX_PAT"
